<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>單元式互動英文單字卡與測驗網頁</title>
  <!-- 載入 p5.js 核心庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    /* 設定全域字型與莫蘭迪色系背景 */
    :root {
      --morandi-bg: #F4F1EA;       /* 溫潤燕麥灰米色背景 */
      --morandi-card: #E3EDE8;     /* 柔和灰綠色卡片 */
      --morandi-primary: #8A9A86;  /* 沉穩莫蘭迪綠 */
      --morandi-accent: #D4A5A5;   /* 溫柔莫蘭迪粉紅 */
      --morandi-text: #4A4A4A;     /* 柔和深灰文字 */
      --morandi-border: #D1CCD2;   /* 淡灰紫邊框 */
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--morandi-bg);
      color: var(--morandi-text);
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #5C6B53;
    }

    /* 控制面板與導航按鈕容器 */
    .control-panel {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
      width: min(850px, calc(100vw - 24px));
      box-sizing: border-box;
    }

    .btn-group {
      display: flex;
      gap: 5px;
      background: #E8E4DC;
      padding: 5px;
      border-radius: 8px;
      max-width: 100%;
      box-sizing: border-box;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* 共用按鈕美學設計 */
    button {
      background-color: #FAF8F5;
      border: 1px solid var(--morandi-border);
      color: var(--morandi-text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: var(--morandi-primary);
      color: white;
      border-color: var(--morandi-primary);
    }

    button.active {
      background-color: var(--morandi-primary);
      color: white;
      border-color: var(--morandi-primary);
    }

    /* 畫布容器樣式 */
    #canvas-container {
      width: min(850px, calc(100vw - 24px));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
      background-color: #FFFFFF;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎴 互動英文單字卡與隨堂測驗</h1>
  </header>

  <!-- 導航控制面板 -->
  <div class="control-panel">
    <!-- 單元切換選單群組 -->
    <div class="btn-group" id="unit-group">
      <button class="unit-btn active" data-unit="Unit 1">Unit 1</button>
      <button class="unit-btn" data-unit="Unit 2">Unit 2</button>
      <button class="unit-btn" data-unit="Unit 3">Unit 3</button>
    </div>

    <!-- 模式切換按鈕群組 -->
    <div class="btn-group" id="mode-group">
      <button class="mode-btn active" data-mode="cards">🎴 單字卡模式</button>
      <button class="mode-btn" data-mode="quiz">📝 隨堂測驗模式</button>
    </div>
  </div>

  <!-- p5.js 渲染畫布容器 -->
  <div id="canvas-container"></div>

  <!-- 引入主程式碼 -->
  <script src="sketch.js"></script>
</body>
</html>
